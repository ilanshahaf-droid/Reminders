<!doctype html>
<html lang="he" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<style>
:root{--bg:#dfe1ea;--bar:#ffffff;--fg:#14161f;--acc:#4f46e5;--chip:#eef0f7}
.dark{--bg:#2a2c36;--bar:#1c1e27;--fg:#e8eaf2;--acc:#9ea0ff;--chip:#2c2f3b}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,Roboto,Arial,sans-serif;-webkit-tap-highlight-color:transparent;overflow:hidden}
#app{position:fixed;inset:0;display:flex;flex-direction:column}
#fbar{display:flex;gap:6px;align-items:center;padding:6px;background:var(--bar);border-bottom:1px solid #0002;overflow-x:auto}
#fbar button{border:0;border-radius:10px;background:var(--chip);height:36px;padding:0 12px;font-size:14px;white-space:nowrap}
#fbar #fillGo{background:var(--acc);color:#fff;font-weight:700}
.fld{position:absolute;border:1.5px solid #4f8cff;background:#4f8cff22;border-radius:2px;box-sizing:border-box;z-index:3}
.fld.done{border-color:#19a35a88;background:transparent}
.fld.cur{border-color:#ff9800;background:#ff980033}
#pages.active .fld{pointer-events:none}
#fsheet{background:var(--bar);border-top:2px solid var(--acc);padding:8px 12px 10px;display:flex;flex-direction:column;gap:6px}
#fsheet .top{display:flex;justify-content:space-between;align-items:center;font-size:12px;opacity:.75}
#fsLabel{font-weight:700;font-size:16px}
#fsBody input[type=text],#fsBody select{width:100%;box-sizing:border-box;font-size:17px;padding:9px;border:1px solid #0004;border-radius:10px;background:var(--bg);color:var(--fg)}
#fsBody .chips{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
#fsBody .chips button,#fsheet .nav button,#fsheet .more button,#fsX{border:0;border-radius:10px;background:var(--chip);height:36px;padding:0 12px;font-size:14px}
#fsBody .chk,#fsBody .opts label{display:flex;gap:8px;align-items:center;font-size:16px;padding:4px 0}
#fsBody .sigprev{height:60px;display:flex;align-items:center;justify-content:center;background:#fff;border-radius:8px}
#fsBody .sigprev img{max-height:56px;max-width:100%}
#fsheet .nav{display:flex;gap:8px}#fsheet .nav button{flex:1}
#fsNext{background:var(--acc)!important;color:#fff!important}
#fsheet .more{display:flex}#fsheet .more{gap:12px}#fsheet .more button{background:transparent;font-size:13px;opacity:.85;padding:0}
#mdModal{position:fixed;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;z-index:50}
#mdModal .box{background:var(--bar);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:10px;width:min(86vw,360px)}
#mdModal input{font-size:16px;padding:9px;border:1px solid #0004;border-radius:10px;background:var(--bg);color:var(--fg)}
#mdModal .row{display:flex;gap:8px;justify-content:flex-end}#mdModal button{border:0;border-radius:10px;background:var(--chip);height:38px;padding:0 16px}#mdOk{background:var(--acc)!important;color:#fff!important}
#scroller{flex:1;overflow:auto;-webkit-overflow-scrolling:touch}
#pages{display:flex;flex-direction:column;align-items:flex-start;gap:10px;padding:8px;width:max-content;min-width:100%;box-sizing:border-box}
.pg{position:relative;background:#fff;box-shadow:0 1px 6px #0004;flex:none}
.pgc,.pgo{position:absolute;left:0;top:0}
.pgo{touch-action:auto}
#pages.active .pgo{touch-action:none}
.pgn{position:absolute;bottom:4px;left:6px;font-size:11px;color:#777;background:#fffc;border-radius:8px;padding:0 6px;pointer-events:none}
.ptext{position:absolute;margin:0;padding:0;border:2px dashed var(--acc);background:#fff9;outline:none;resize:none;overflow:hidden;font-family:Arial,sans-serif;line-height:1.25;z-index:5}
#tray{display:flex;gap:8px;align-items:center;justify-content:center;padding:6px;background:var(--bar);border-top:1px solid #0002;flex-wrap:wrap}
#bar{display:flex;gap:3px;align-items:center;justify-content:space-between;padding:6px 4px;overflow-x:auto;background:var(--bar);border-top:1px solid #0002}
button{font:inherit;color:var(--fg)}
#bar button{flex:1 1 0;min-width:25px;max-width:44px;height:40px;border:2px solid transparent;border-radius:11px;background:var(--chip);font-size:16px;padding:0}
#bar button.on{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 22%,transparent)}
#bar .zl{font-size:11px;flex:none;width:34px;text-align:center}
.sw{width:32px;height:32px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1px #0004;padding:0}
.sw.on,.sz.on{box-shadow:0 0 0 3px var(--acc)}
.sz{min-width:38px;height:36px;border:0;border-radius:10px;background:var(--chip);padding:0 10px}
.hide{display:none!important}
#sigModal{position:fixed;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;z-index:50}
#sigModal .box{background:var(--bar);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:10px;align-items:center}
#sigCv{background:repeating-linear-gradient(#fff,#fff 219px,#9aa 219px,#9aa 220px);border-radius:10px;touch-action:none}
#sigModal .row{display:flex;gap:8px}#sigModal button{border:0;border-radius:10px;background:var(--chip);height:40px;padding:0 16px;font-size:15px}#sigOk{background:var(--acc)!important;color:#fff!important}
</style></head><body>
<div id="app">
  <div id="fbar"><button id="fillGo" class="hide">📝 מילוי השדות</button><button id="dateGo">📅 תאריך</button><button id="myGo">👤 הפרטים שלי</button></div>
  <div id="scroller"><div id="pages"></div></div>
  <div id="fsheet" class="hide"><div class="top"><span id="fsPos"></span><button id="fsX">✕</button></div><div id="fsLabel"></div><div id="fsBody"></div>
    <div class="nav"><button id="fsPrev">הקודם</button><button id="fsNext">הבא</button></div><div class="more"><button id="fsMove">↔ הזז</button><button id="fsWp">▭+</button><button id="fsWm">▭−</button><button id="fsRen">✏️ שם</button><button id="fsDel" style="margin-inline-start:auto">זה לא שדה – הסרה</button></div></div>
  <div id="tray" class="hide"></div>
  <div id="bar">
    <button data-t="scroll" class="on" aria-label="גלילה">✋</button>
    <button data-t="pen" aria-label="עט">✏️</button>
    <button data-t="hl" aria-label="מרקר">🖍</button>
    <button data-t="text" aria-label="טקסט"><b>T</b></button>
    <button data-t="sig" aria-label="חתימה">✍️</button>
    <button data-t="move" aria-label="הזזה">↔️</button>
    <button data-t="erase" aria-label="מחק">🧽</button>
    <button id="undo" aria-label="בטל">↶</button>
    <button id="zout" aria-label="הקטן">➖</button><span class="zl" id="zl">100%</span><button id="zin" aria-label="הגדל">➕</button>
  </div>
</div>
<div id="mdModal" class="hide"><div class="box"><div style="font-weight:700">הפרטים שלי (למילוי אוטומטי)</div>
  <input id="mdName" placeholder="שם מלא" autocomplete="off"><input id="mdTz" placeholder="מספר תעודת זהות" inputmode="numeric" autocomplete="off">
  <div class="row"><button id="mdCancel">ביטול</button><button id="mdOk">שמירה</button></div></div></div>
<div id="sigModal" class="hide"><div class="box"><div style="font-weight:700">צייר את החתימה</div><canvas id="sigCv"></canvas>
  <div class="row"><button id="sigClear">נקה</button><button id="sigCancel">ביטול</button><button id="sigOk">אישור</button></div></div></div>
<div id="stModal" class="hide" style="position:fixed;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;z-index:50"><div style="background:var(--bar);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:10px;width:min(90vw,380px)"><b>טקסט החותמת</b><textarea id="stText" rows="3" style="font-size:16px;border-radius:10px;padding:8px"></textarea><div class="row" style="display:flex;gap:8px"><button id="stCancel" style="flex:1;height:40px;border:0;border-radius:10px">ביטול</button><button id="stOk" style="flex:1;height:40px;border:0;border-radius:10px;background:var(--acc);color:#fff">הוספה</button></div></div></div>
<script src="pdfviewer.js"></script>
<script>if(window.Android) Android.ready();</script>
</body></html>
