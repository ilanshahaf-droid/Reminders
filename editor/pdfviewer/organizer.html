<!doctype html>
<html lang="he" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<style>
:root{--bg:#eceef5;--bar:#fff;--fg:#14161f;--acc:#4f46e5;--chip:#eef0f7}
.dark{--bg:#2a2c36;--bar:#1c1e27;--fg:#e8eaf2;--acc:#9ea0ff;--chip:#2c2f3b}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,Roboto,Arial,sans-serif;-webkit-tap-highlight-color:transparent;overflow:hidden}
#app{position:fixed;inset:0;display:flex;flex-direction:column}
#gridwrap{flex:1;overflow:auto;padding:10px}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:10px}
.cell{position:relative;border-radius:10px;padding:6px;background:var(--bar);border:3px solid transparent;box-shadow:0 1px 4px #0003}
.cell.sel{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 18%,var(--bar))}
.tb{aspect-ratio:3/4;display:flex;align-items:center;justify-content:center;background:#fff;overflow:hidden}
.tb canvas{max-width:100%;max-height:100%;transition:transform .15s}
.bd{position:absolute;bottom:8px;right:8px;background:#000a;color:#fff;border-radius:9px;padding:0 7px;font-size:12px}
#cnt{padding:6px 12px;font-size:13px;color:var(--fg);background:var(--bar);border-top:1px solid #0002}
#obar{display:flex;gap:4px;padding:6px 4px;background:var(--bar);justify-content:space-between}
#obar button{flex:1 1 0;min-width:25px;max-width:56px;height:42px;border:0;border-radius:11px;background:var(--chip);font-size:17px;color:var(--fg);padding:0}
</style></head><body>
<div id="app">
  <div id="gridwrap"><div id="grid"></div></div>
  <div id="cnt"></div>
  <div id="obar">
    <button data-a="all" aria-label="בחר הכל">☑</button>
    <button data-a="rot" aria-label="סובב">↻</button>
    <button data-a="left" aria-label="הקדם">▶</button>
    <button data-a="right" aria-label="אחר">◀</button>
    <button data-a="del" aria-label="מחק">🗑</button>
    <button data-a="extract" aria-label="חלץ לקובץ חדש">✂️</button>
    <button data-a="undo" aria-label="בטל">↶</button>
  </div>
</div>
<script src="pdfviewer.js"></script>
<script>if(window.Android) Android.ready();</script>
</body></html>
