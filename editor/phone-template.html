<!doctype html>
<html lang="he" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>
html,body{margin:0;height:100%;background:transparent;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;-webkit-tap-highlight-color:transparent}
:root{--ne-fg:#14161f;--ne-mute:#7b8094;--ne-accent:#4f46e5;--ne-bar:rgba(255,255,255,.82);--ne-line:rgba(0,0,0,.14);--ne-chip:rgba(79,70,229,.18)}
.dark{--ne-fg:#e8eaf2;--ne-mute:#9aa0b8;--ne-accent:#9ea0ff;--ne-bar:rgba(22,24,32,.88);--ne-line:rgba(255,255,255,.16);--ne-chip:rgba(158,160,255,.24)}
#app{height:100%}
/*NE-CSS*/
</style></head>
<body><div id="app"></div>
<script>
/*NE-JS*/
var editor = createNoteEditor(document.getElementById('app'), {
  placeholder: 'כתוב כאן…',
  onError: function(m){ if(window.Android) Android.toast(m); },
  onChange: function(html, text){ if(window.Android) Android.changed(html, text); }
});
window.NE = {
  load: function(html, dark){ document.documentElement.className = dark ? 'dark' : ''; editor.setHtml(html || ''); },
  theme: function(dark){ document.documentElement.className = dark ? 'dark' : ''; },
  focus: function(){ editor.focus(); },
  flush: function(){ editor.flush(); },
  insert: function(t){ editor.focus(); document.execCommand('insertText', false, t); editor.flush(); }
};
if(window.Android) Android.ready();
</script></body></html>
