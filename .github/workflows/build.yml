name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Build phone app
        run: gradle :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: reminders-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Build watch app
        id: wear
        continue-on-error: true
        run: gradle :wear:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        if: steps.wear.outcome == 'success'
        with:
          name: reminders-watch-apk
          path: wear/build/outputs/apk/debug/wear-debug.apk
      - name: Publish APKs to the 'latest' release (fixed download links)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FILES="app/build/outputs/apk/debug/app-debug.apk"
          [ -f wear/build/outputs/apk/debug/wear-debug.apk ] && FILES="$FILES wear/build/outputs/apk/debug/wear-debug.apk"
          gh release delete latest --cleanup-tag -y || true
          gh release create latest $FILES --title "latest" --notes "Latest build: ${{ github.sha }}"
      - name: Fail if the watch build failed
        if: steps.wear.outcome == 'failure'
        run: echo "watch build failed - phone APK is still available" && exit 1
